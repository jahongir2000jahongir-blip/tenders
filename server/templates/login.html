<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — tenders.best</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; }
  .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-xl); padding: 32px; box-shadow: var(--shadow-md); }
  .card .brand { margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 0 0 6px; }
  input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; font: inherit; margin-bottom: 14px; outline: 0; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(43,92,246,.14); }
  .card .btn { width: 100%; margin-top: 4px; }
  .err { background: var(--danger-soft); color: var(--danger); padding: 9px 12px; border-radius: 8px; font-size: 13.5px; margin-bottom: 14px; }
  .err:empty { display: none; }
  .back { color: var(--muted); font-size: 13.5px; display: inline-block; margin-top: 16px; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
  <form class="card" method="post" action="/admin/login">
    <div class="brand"><img class="brand__mark" src="/assets/img/logo-mark.png" alt=""><span class="brand__name">tenders<b>.best</b></span></div>
    <h1>Панель управления</h1>
    <p>Войдите, чтобы управлять сборщиками и данными.</p>
    <div class="err">{{error}}</div>
    <label for="u">Логин</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Пароль</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn--primary">Войти</button>
    <a class="back" href="/">← На сайт</a>
  </form>
</body>
</html>
