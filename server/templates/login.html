<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — tenders.best</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
  :root { --ink:#0e1230; --muted:#6b7089; --line:#d8dbea; --blue:#0d6ef0; --violet:#7c3aed; --bg:#f4f4fa; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); font-family:"Inter",system-ui,sans-serif; color:var(--ink); }
  .card { width:100%; max-width:400px; background:#fff; border-radius:24px; padding:36px; box-shadow:0 24px 60px -24px rgba(16,24,72,.2); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:26px; font-family:"Manrope",sans-serif; font-weight:800; font-size:20px; color:#0b3c8c; }
  .brand img { width:40px; height:40px; }
  .brand b { color:var(--blue); }
  h1 { font-family:"Manrope",sans-serif; font-size:24px; margin:0 0 6px; letter-spacing:-.02em; }
  p { margin:0 0 22px; color:var(--muted); font-size:14.5px; }
  label { display:block; font-size:13px; font-weight:600; margin:0 0 6px; }
  input { width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; font:inherit; margin-bottom:16px; outline:0; }
  input:focus { border-color:var(--violet); box-shadow:0 0 0 4px rgba(124,58,237,.12); }
  button { width:100%; padding:14px; border:0; border-radius:999px; font:inherit; font-weight:700; color:#fff; cursor:pointer; background:linear-gradient(135deg,#0d6ef0 0%,#7c3aed 58%,#c42be0 100%); }
  .err { background:#fdecec; color:#b42318; padding:10px 12px; border-radius:10px; font-size:13.5px; margin-bottom:16px; }
  .err:empty { display:none; }
  a { color:var(--muted); font-size:13.5px; text-decoration:none; display:inline-block; margin-top:18px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/admin/login">
    <div class="brand"><img src="/assets/img/logo-mark.png" alt="">tenders<b>.best</b></div>
    <h1>Панель управления</h1>
    <p>Войдите, чтобы управлять сборщиками и данными.</p>
    <div class="err">{{error}}</div>
    <label for="u">Логин</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Пароль</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
    <a href="/">← На сайт</a>
  </form>
</body>
</html>
